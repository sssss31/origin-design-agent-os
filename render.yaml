# Render Blueprint: the API as a FREE web service. Postgres lives on Supabase (free), the web app on Vercel.
# Deploy: Render dashboard → New → Blueprint → pick this repo → fill the "sync: false" values (docs/DEPLOY.md).
services:
  - type: web
    name: origin-api
    runtime: docker
    plan: free
    dockerfilePath: infra/deploy/api.Dockerfile
    dockerContext: .
    healthCheckPath: /healthz
    autoDeploy: true
    envVars:
      - key: APP_ENV
        value: production
      - key: SINGLE_INSTANCE          # one instance: inline queue, in-memory events, local uploads
        value: "true"
      - key: DATABASE_URL             # Supabase → Connect → Session pooler URI (port 5432), with your DB password
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: ENCRYPTION_KEY           # any long random value works; a Fernet key is derived from it — never change it later
        generateValue: true
      - key: ALLOWED_ORIGINS          # your Vercel URL(s), comma separated
        value: https://origin-design-agent-os.vercel.app
      - key: FRONTEND_URL
        value: https://origin-design-agent-os.vercel.app
      - key: BOOTSTRAP_ADMIN_EMAIL
        value: admin@origin.local
      - key: BOOTSTRAP_ADMIN_PASSWORD # ≥16 chars; only used to create the first admin — change it after login
        sync: false
      - key: OUTBOUND_ALLOW_HTTP
        value: "false"
      - key: LOG_LEVEL
        value: INFO
