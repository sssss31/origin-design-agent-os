# Render Blueprint: API (free web service) + Postgres, both on Render; the web app is on Vercel.
# Deploy: Render dashboard → New → Blueprint → pick this repo → fill BOOTSTRAP_ADMIN_PASSWORD (docs/DEPLOY.md).
# NOTE: Render's free Postgres is deleted 30 days after creation. Upgrade origin-db (Basic 256 MB, ~$6/mo)
# before day 30 to keep the data, or switch DATABASE_URL to Supabase (free, permanent).
services:
  - type: web
    name: origin-api
    runtime: docker
    plan: free
    dockerfilePath: infra/deploy/api.Dockerfile
    dockerContext: .
    healthCheckPath: /healthz
    autoDeploy: true
    envVars:
      - key: APP_ENV
        value: production
      - key: SINGLE_INSTANCE          # one instance: inline queue, in-memory events, local uploads
        value: "true"
      - key: DATABASE_URL
        fromDatabase:
          name: origin-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: ENCRYPTION_KEY           # any long random value works; a Fernet key is derived from it — never change it later
        generateValue: true
      - key: ALLOWED_ORIGINS          # your Vercel URL(s), comma separated
        value: https://origin-design-agent-os.vercel.app
      - key: FRONTEND_URL
        value: https://origin-design-agent-os.vercel.app
      - key: BOOTSTRAP_ADMIN_EMAIL
        value: admin@origin.local
      - key: BOOTSTRAP_ADMIN_PASSWORD # ≥16 chars; only used to create the first admin — change it after login
        sync: false
      - key: OUTBOUND_ALLOW_HTTP
        value: "false"
      - key: LOG_LEVEL
        value: INFO

databases:
  - name: origin-db
    plan: free                      # expires after 30 days — upgrade to basic-256mb to keep it
    postgresMajorVersion: "17"
