name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  api:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.14", "3.12"]  # 3.12 = Vercel's Python runtime
    defaults:
      run: { working-directory: apps/api }
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env: { POSTGRES_USER: origin, POSTGRES_PASSWORD: origin, POSTGRES_DB: origin_test }
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U origin" --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      TEST_DATABASE_URL: postgresql+psycopg://origin:origin@localhost:5432/origin_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "${{ matrix.python-version }}" }
      - run: pip install -e ".[dev]"
      - name: Vercel function smoke (locked requirements import the ASGI app)
        if: matrix.python-version == '3.12'
        run: |
          pip install -r requirements.txt
          SERVERLESS=true python -c "import api.index as m; print(type(m.app).__name__)"
      - run: ruff check . && ruff format --check .
      - run: mypy app
      - run: pytest -q
      - name: Security — bandit
        run: bandit -q -r app -ll
      - name: Security — pip-audit
        run: pip-audit -r requirements.lock.txt --progress-spinner off
  web:
    runs-on: ubuntu-latest
    defaults:
      run: { working-directory: apps/web }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "24", cache: npm, cache-dependency-path: apps/web/package-lock.json }
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Security — npm audit
        run: npm audit --audit-level=high
