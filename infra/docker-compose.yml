# Local full stack: Postgres (pgvector), Redis, MinIO, API, worker, web.
#   cp .env.example .env && docker compose -f infra/docker-compose.yml --env-file .env up --build
name: origin-design-agent-os

services:
  postgres:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_DB: origin
      POSTGRES_USER: origin
      POSTGRES_PASSWORD: origin
    ports: ["5432:5432"]
    volumes: [postgres_data:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U origin -d origin"]
      interval: 3s
      timeout: 3s
      retries: 30

  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 30

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${OBJECT_STORAGE_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${OBJECT_STORAGE_SECRET_KEY:-minioadmin}
    ports: ["9000:9000", "9001:9001"]
    volumes: [minio_data:/data]
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 20

  api:
    build:
      context: ..
      dockerfile: infra/deploy/api.Dockerfile
    env_file: ../.env
    environment:
      DATABASE_URL: postgresql+psycopg://origin:origin@postgres:5432/origin
      REDIS_URL: redis://redis:6379/0
      STORAGE_BACKEND: s3
      OBJECT_STORAGE_ENDPOINT: http://minio:9000
      OBJECT_STORAGE_PUBLIC_ENDPOINT: http://localhost:9000
      OBJECT_STORAGE_ACCESS_KEY: ${OBJECT_STORAGE_ACCESS_KEY:-minioadmin}
      OBJECT_STORAGE_SECRET_KEY: ${OBJECT_STORAGE_SECRET_KEY:-minioadmin}
      QUEUE_BACKEND: redis
      EVENT_BUS_BACKEND: redis
      LOG_FORMAT: json
    ports: ["8000:8000"]
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      minio: { condition: service_healthy }

  worker:
    build:
      context: ..
      dockerfile: infra/deploy/api.Dockerfile
    command: ["python", "-m", "app.workers.main"]
    env_file: ../.env
    environment:
      DATABASE_URL: postgresql+psycopg://origin:origin@postgres:5432/origin
      REDIS_URL: redis://redis:6379/0
      STORAGE_BACKEND: s3
      OBJECT_STORAGE_ENDPOINT: http://minio:9000
      OBJECT_STORAGE_PUBLIC_ENDPOINT: http://localhost:9000
      OBJECT_STORAGE_ACCESS_KEY: ${OBJECT_STORAGE_ACCESS_KEY:-minioadmin}
      OBJECT_STORAGE_SECRET_KEY: ${OBJECT_STORAGE_SECRET_KEY:-minioadmin}
      QUEUE_BACKEND: redis
      EVENT_BUS_BACKEND: redis
      LOG_FORMAT: json
    depends_on:
      api: { condition: service_started }

  web:
    build:
      context: ../apps/web
      dockerfile: ../../infra/deploy/web.Dockerfile
      args:
        NEXT_PUBLIC_API_BASE_URL: http://localhost:8000/api/v1
    ports: ["3000:3000"]
    depends_on: [api]

volumes:
  postgres_data:
  minio_data:
