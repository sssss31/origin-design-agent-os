[project]
name = "origin-api"
version = "0.1.0"
description = "Origin Design Agent OS — API service"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.116",
  "uvicorn[standard]>=0.35",
  "sqlalchemy[asyncio]>=2.0.43",
  "psycopg[binary]>=3.2",
  "alembic>=1.16",
  "pydantic>=2.11",
  "pydantic-settings>=2.10",
  "pyjwt>=2.10",
  "argon2-cffi>=23",
  "cryptography>=45",
  "structlog>=25",
  "python-multipart>=0.0.20",
  "httpx>=0.28",
  "jsonschema>=4.23",
  "boto3>=1.40",
  "redis>=6",
  "sse-starlette>=2.1",
  "typer>=0.15",
  "pillow>=11",
  "pypdf>=5",
  "openai>=1.100",
  "openai-agents>=0.3",
]

[project.optional-dependencies]
dev = [
  "pytest>=8",
  "pytest-asyncio>=1",
  "pytest-cov>=6",
  "ruff>=0.12",
  "mypy>=1.17",
  "bandit>=1.8",
  "pip-audit>=2.8",
]
openai = [
  "openai>=1.100",
  "openai-agents>=0.3",
]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.ruff]
line-length = 110
target-version = "py312"
src = ["app", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "ASYNC", "S", "T20"]
ignore = ["S101", "B008", "S105", "S106"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S", "T20", "E501"]
"alembic/*" = ["I", "E501"]
"app/cli.py" = ["T20"]
"scripts/*" = ["T20"]
"app/tools/builtin.py" = ["E501"]
"app/workers/run_executor.py" = ["E501"]
"app/services/context.py" = ["E501"]
"app/seeds/*" = ["E501"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
testpaths = ["tests"]
filterwarnings = ["error::DeprecationWarning:app.*"]

[tool.mypy]
python_version = "3.12"
plugins = ["pydantic.mypy"]
strict_optional = true
warn_unused_ignores = true
check_untyped_defs = true
ignore_missing_imports = true
exclude = ["alembic/", "tests/"]
